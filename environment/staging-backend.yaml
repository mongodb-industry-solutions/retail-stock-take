# Backend (staging). Loaded after environment/staging.yaml by the Drone deploy.
# Create in the namespace first:
#   - secret retail-stock-take : keys MONGODB_URI (Atlas SRV string)
#       + GROVE_API_KEY (Grove gateway key — see docs/INTERNAL_DEPLOY_MAINTENANCE.md)
#   - secret jwt-keys : files jwt-private.pem + jwt-public.pem
# S3: uploaded frames go to the shared industry-solutions-demos bucket under
# industry/mobile/retail-stock-take/uploads/ (3-month retention: object + doc).
# The IRSA role (kanopy-staging-cicd-irsa) needs S3 access to that prefix; the
# curated sample-shelves prefix is read via /api/sample-shelves. Backend has NO
# ingress (the Drone step omits ingress.enabled); it is reached via the frontend
# /api proxy and by PowerSync (JWKS) over the in-cluster Service.
services:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
    probes: true
probes:
  enabled: true
  path: /api/health
env:
  DATABASE_NAME: retail-stock-take
  APP_NAME: retail-stock-take-backend
  APP_COLLECTION: inventory_captures
  # Photo store on against AWS S3 (IRSA via the default credential chain).
  # Uploads use STORAGE_UPLOAD_PREFIX (sibling of sample-shelves/); the reconciler
  # deletes object + doc past RETENTION_DAYS.
  STORAGE_PROVIDER: s3
  STORAGE_BUCKET: industry-solutions-demos
  STORAGE_UPLOAD_PREFIX: industry/mobile/retail-stock-take/uploads/
  STORAGE_SAMPLES_PREFIX: industry/mobile/retail-stock-take/sample-shelves/
  RETENTION_DAYS: "90"
  RECONCILER_INTERVAL_SECONDS: "300"
  JWT_PRIVATE_KEY_PATH: /secrets/jwt-private.pem
  JWT_PUBLIC_KEY_PATH: /secrets/jwt-public.pem
  JWT_KID: retail-key-1
  JWT_ALGORITHM: RS256
  PS_JWT_AUDIENCE: powersync
  PS_JWT_ISSUER: retail-stock-take
  POWERSYNC_PUBLIC_URL: https://retail-stock-take-powersync.industrysolutions.staging.corp.mongodb.com
  POWERSYNC_INTERNAL_URL: http://retail-stock-take-powersync-web-app-80
  # Cloud CV via Grove (MongoDB's GenAI gateway — OpenAI-compatible + vision).
  # Base URL + model default to the current best; override to match whatever
  # your Grove request provisioned. GROVE_API_KEY comes from the secret below.
  CV_PROVIDER: grove
  GROVE_BASE_URL: https://grove-gateway-prod.azure-api.net/grove-foundry-prod/openai/v1
  GROVE_MODEL: gpt-5.5
  GROVE_FALLBACK_MODEL: gpt-4o
envSecrets:
  MONGODB_URI: retail-stock-take
  GROVE_API_KEY: retail-stock-take
volumeSecrets:
  - name: jwt-keys
    path: /secrets
