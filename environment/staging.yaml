# Shared Kanopy values for ALL retail-stock-take releases (staging).
# Each Drone deploy step loads this base PLUS environment/staging-<service>.yaml.
# Requires web-app chart v4.30.0+.
security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: alberto.camarena@mongodb.com

# IRSA grants the pods AWS access (S3 for the storage adapter) with no static keys.
serviceAccount:
  enabled: true
  irsa:
    accountId: "275662791714"
    roleName: "kanopy-staging-cicd-irsa"

env:
  AWS_REGION: us-east-1
