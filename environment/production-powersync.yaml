# Self-hosted PowerSync (production). Loaded after environment/production.yaml.
# Requires configmap powersync-config + secret retail-stock-take
# (PS_DATA_SOURCE_URI + PS_MONGO_URI) in the namespace.
args: ["start", "-r", "unified"]
services:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
    probes: true
    ingress: true
probes:
  enabled: true
  liveness:
    path: /probes/liveness
  readiness:
    path: /probes/readiness
env:
  PS_PORT: "8080"
  POWERSYNC_CONFIG_PATH: /config/powersync.yaml
  PS_JWKS_URL: http://retail-stock-take-backend-web-app-80/api/auth/keys
  PS_JWT_AUDIENCE: powersync
  PS_JWT_ISSUER: retail-stock-take
envSecrets:
  PS_DATA_SOURCE_URI: retail-stock-take
  PS_MONGO_URI: retail-stock-take
extraVolumes:
  - name: powersync-config
    configMap:
      name: powersync-config
extraVolumeMounts:
  - name: powersync-config
    mountPath: /config
    readOnly: true
