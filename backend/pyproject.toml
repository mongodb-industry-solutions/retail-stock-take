[project]
name = "retail-stock-take-backend"
version = "0.1.0"
description = "FastAPI backend for the MongoDB + PowerSync retail-stock-take demo."
authors = [{name = "Industry Solutions", email = "industry-solutions@mongodb.com"}]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pymongo>=4.10.1",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.4",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.18",
    "pyjwt[crypto]>=2.10.0",
    "cryptography>=48.0.1",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "boto3>=1.35.70",
    "botocore>=1.35.70",
    "voyageai>=0.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "moto[s3]>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
