# Cloud Manager project config for the MCK operator.
#
# PREREQUISITE (you create these in cloud.mongodb.com before `make setup`):
#   1. An Organization  -> copy its 24-char hex Org ID into orgId below.
#   2. A Project (any name) -> set projectName below (operator creates it if absent).
#   3. A programmatic API key (Project Owner role) -> goes in the Secret (see
#      credentials.secret.example.yaml). Add the cluster egress IP to the
#      project's API access list, or the operator's calls are blocked.
#
# baseUrl is the Cloud Manager SaaS endpoint (NOT a self-hosted Ops Manager).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-manager-project
  namespace: mongodb
data:
  baseUrl: "https://cloud.mongodb.com"
  orgId: "REPLACE_WITH_CLOUD_MANAGER_ORG_ID"
  projectName: "retail-stock-take"
