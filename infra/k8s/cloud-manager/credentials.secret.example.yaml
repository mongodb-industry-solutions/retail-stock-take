# Cloud Manager programmatic API key for the MCK operator.
#
# DO NOT COMMIT REAL KEYS. Either:
#   kubectl -n mongodb create secret generic cloud-manager-credentials \
#     --from-literal=publicKey=<PUBLIC_API_KEY> \
#     --from-literal=privateKey=<PRIVATE_API_KEY>
# or copy this file to credentials.secret.yaml (gitignored) and fill it in.
#
# Field names are the current MCK (v1.8.x) form: publicKey / privateKey.
apiVersion: v1
kind: Secret
metadata:
  name: cloud-manager-credentials
  namespace: mongodb
type: Opaque
stringData:
  publicKey: "REPLACE_WITH_PUBLIC_API_KEY"
  privateKey: "REPLACE_WITH_PRIVATE_API_KEY"
