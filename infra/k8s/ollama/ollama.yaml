---
# Ollama VLM server — runs inside the kind cluster so backend pods reach it
# directly over in-cluster DNS (http://ollama:11434). OLLAMA_ORIGINS is set so
# the Host-header DNS-rebinding check allows that hostname.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: retail
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
            - name: OLLAMA_ORIGINS
              value: "http://ollama:11434"
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "8"
              memory: 10Gi
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  namespace: retail
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
# ClusterIP replaces the old ExternalName Service (host.docker.internal).
# The backend's OLLAMA_BASE_URL (http://ollama:11434) is unchanged.
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: retail
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
