# SeaweedFS — local S3-compatible object store (the SeaweedFS->AWS S3 swap is
# config-only; the backend's storage adapter never touches SeaweedFS-native APIs).
# All-in-one: master + volume + filer + S3 gateway in one process (`weed server -s3`).
---
# S3 identity granting the demo access key full access to the demo bucket.
# Keys MUST match STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY in the backend env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-s3-config
  namespace: retail
data:
  s3.json: |
    {
      "identities": [
        {
          "name": "retaildemo",
          "credentials": [
            { "accessKey": "retaildemo", "secretKey": "retaildemo-secret" }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        },
        {
          "name": "anonymous",
          "actions": ["Read", "List"]
        }
      ]
    }
---
# NodePort so the S3 API is reachable from the host (Compass-for-S3 tools, the
# AWS CLI, Cyberduck…) AND in-cluster via its stable DNS name `seaweedfs:8333`.
# A NodePort Service still has a ClusterIP, so changing the type here does NOT
# affect the backend/powersync pods that resolve `seaweedfs` internally.
# Host wiring: kind maps host :8333 -> nodePort 30333 (see infra/k8s/kind-cluster.yaml).
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: retail
  labels:
    app: seaweedfs
spec:
  type: NodePort
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
      nodePort: 30333
    - name: filer
      port: 8888
      targetPort: 8888
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: retail
  labels:
    app: seaweedfs
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          # Pin to a current stable SeaweedFS release; verify the tag exists.
          image: chrislusf/seaweedfs:3.97
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.config=/etc/seaweedfs/s3.json
            - -s3.port=8333
            - -master.volumeSizeLimitMB=1024
          ports:
            - name: s3
              containerPort: 8333
            - name: filer
              containerPort: 8888
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8333
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8333
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
      volumes:
        - name: s3-config
          configMap:
            name: seaweedfs-s3-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
